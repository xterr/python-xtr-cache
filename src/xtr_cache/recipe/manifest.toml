# The recipe for xtr-cache: what *Use in an application* in the README takes,
# as data. Keep the two in step — the README is the source.

[bundles]
# "<module>:<class>" = the environments it is listed with, exactly as in BUNDLES.
"xtr_cache.bundle:CacheBundle" = { all = true }

[files]
# Destination under the application package = template under this recipe.
# The bundle's own defaults written out — one "app" pool on files, nothing opened
# until a pool is first asked for — as the place pools and adapters go.
"config/packages/cache.py" = "files/config/cache.py.tmpl"

# No [env]: nothing is required. A DSN an application gives as env(...) must be
# set when it boots, because booting checks every pool.

[gitignore]
# A pool on files writes under kernel.share_dir, var/share in the project.
lines = ["/var/"]

[notes]
check = ["<script> debug:bundles — cache is listed and active"]
